plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'fr.a21assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.a21connect'
        minSdk 26
        // Android 12 target: keep installation/runtime behavior conservative
        // while retaining a modern compile SDK.
        targetSdk 32
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install("https://github.com/GotoRyugen/memoryaicm/archive/refs/heads/main.zip")
        }
    }
}
