plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'fr.a21assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.a21assistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install("https://github.com/GotoRyugen/memoryaicm/archive/refs/heads/main.zip")
        }
    }
}
